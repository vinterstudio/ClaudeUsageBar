<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2724"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#E8A87C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- macOS icon grid: 824x824 content, 185 corner radius, centred -->
  <g transform="translate(100,100)">
    <rect width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
    <rect width="824" height="824" rx="185" ry="185" fill="url(#sheen)"/>
    <rect x="2" y="2" width="820" height="820" rx="183" ry="183" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>

    <!-- gauge: track + 72% arc, open at the bottom -->
    <g transform="translate(412,400)">
      <path d="M -196 138 A 240 240 0 1 1 196 138"
            fill="none" stroke="#ffffff" stroke-opacity="0.12"
            stroke-width="58" stroke-linecap="round"/>
      <path d="M -196 138 A 240 240 0 1 1 231 -65"
            fill="none" stroke="url(#arc)"
            stroke-width="58" stroke-linecap="round"/>
    </g>

    <!-- menu-bar tick marks inside the gauge -->
    <g fill="#F4EFE9" transform="translate(412,392)">
      <rect x="-104" y="-34" width="208" height="26" rx="13"/>
      <rect x="-104" y="14" width="132" height="26" rx="13" fill-opacity="0.55"/>
    </g>
  </g>
</svg>
